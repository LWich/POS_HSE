repos:
  - repo: local
    hooks:
      - id: pos-quality
        name: POS quality checks in Docker
        language: system
        entry: >-
          sh -ec 'if docker compose version >/dev/null 2>&1;
          then exec docker compose run --rm --build quality;
          fi; exec docker-compose run --rm --build quality'
        files: ^(pos/|tests/|Dockerfile$|compose\.yaml$|pyproject\.toml$|requirements.*\.txt$)
        pass_filenames: false
